<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d14;
      --card: #13131f;
      --card2: #1a1a2e;
      --border: rgba(255,255,255,0.08);
      --x-color: #7c5cfc;
      --o-color: #c8f03e;
      --text: #e8e8f0;
      --muted: #6b6e80;
      --success: #3ecf8e;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app { width: 100%; max-width: 480px; }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 2rem; }

    header h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -1px;
    }

    header h1 .x { color: var(--x-color); }
    header h1 .o { color: var(--o-color); }

    /* ── MODE SELECTOR ── */
    .mode-selector {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.5rem;
    }

    .mode-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
    }

    .mode-btn.active {
      background: var(--card2);
      color: var(--text);
    }

    /* ── SCOREBOARD ── */
    .scoreboard {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .score-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: border-color 0.3s;
    }

    .score-box.active-turn { border-color: var(--x-color); }
    .score-box.active-turn.o-turn { border-color: var(--o-color); }

    .score-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .score-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .score-x { color: var(--x-color); }
    .score-o { color: var(--o-color); }

    .score-num {
      font-size: 1.8rem;
      font-weight: 900;
    }

    .score-draws {
      flex: 0.7;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    /* ── STATUS ── */
    .status {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 1.2rem;
      min-height: 1.4rem;
      transition: color 0.3s;
    }

    /* ── BOARD ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: var(--card2);
      border-color: rgba(255,255,255,0.15);
      transform: scale(1.03);
    }

    .cell.taken { cursor: not-allowed; }

    .cell.x-cell { color: var(--x-color); }
    .cell.o-cell { color: var(--o-color); }

    .cell.winner {
      background: var(--card2);
      animation: winPulse 0.5s ease forwards;
    }

    .cell.winner.x-cell { border-color: var(--x-color); box-shadow: 0 0 20px rgba(124,92,252,0.3); }
    .cell.winner.o-cell { border-color: var(--o-color); box-shadow: 0 0 20px rgba(200,240,62,0.3); }

    @keyframes winPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .cell.pop {
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      0%   { transform: scale(0.7); opacity: 0.5; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 0.7rem;
    }

    .btn {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--x-color);
      color: #fff;
    }

    .btn-primary:hover { box-shadow: 0 6px 20px rgba(124,92,252,0.4); transform: translateY(-2px); }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--card2); }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1><span class="x">Tic</span>-<span class="o">Tac</span>-Toe</h1>
  </header>

  <!-- MODE -->
  <div class="mode-selector">
    <button class="mode-btn active" id="btnPvP" onclick="setMode('pvp')">👥 Player vs Player</button>
    <button class="mode-btn" id="btnPvC" onclick="setMode('pvc')">🤖 Player vs Computer</button>
  </div>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <div class="score-box active-turn" id="scoreX">
      <div class="score-label">Player</div>
      <div class="score-name score-x" id="nameX">X</div>
      <div class="score-num score-x" id="numX">0</div>
    </div>
    <div class="score-draws">
      <div class="score-label">Draws</div>
      <div class="score-num" style="color:var(--muted)" id="numD">0</div>
    </div>
    <div class="score-box" id="scoreO">
      <div class="score-label" id="labelO">Player</div>
      <div class="score-name score-o" id="nameO">O</div>
      <div class="score-num score-o" id="numO">0</div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="status" id="status">X's turn</div>

  <!-- BOARD -->
  <div class="board" id="board">
    <div class="cell" onclick="handleClick(0)"></div>
    <div class="cell" onclick="handleClick(1)"></div>
    <div class="cell" onclick="handleClick(2)"></div>
    <div class="cell" onclick="handleClick(3)"></div>
    <div class="cell" onclick="handleClick(4)"></div>
    <div class="cell" onclick="handleClick(5)"></div>
    <div class="cell" onclick="handleClick(6)"></div>
    <div class="cell" onclick="handleClick(7)"></div>
    <div class="cell" onclick="handleClick(8)"></div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
    <button class="btn btn-secondary" onclick="resetAll()">Reset Scores</button>
  </div>

</div>

<script>
  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let mode = 'pvp'; // 'pvp' or 'pvc'
  let scores = { X: 0, O: 0, D: 0 };

  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function setMode(m) {
    mode = m;
    document.getElementById('btnPvP').classList.toggle('active', m === 'pvp');
    document.getElementById('btnPvC').classList.toggle('active', m === 'pvc');
    document.getElementById('labelO').textContent = m === 'pvc' ? 'Computer' : 'Player';
    document.getElementById('nameO').textContent = m === 'pvc' ? '🤖' : 'O';
    resetAll();
  }

  function handleClick(i) {
    if (gameOver || board[i]) return;
    if (mode === 'pvc' && currentPlayer === 'O') return;
    makeMove(i);
    if (mode === 'pvc' && !gameOver && currentPlayer === 'O') {
      setTimeout(computerMove, 400);
    }
  }

  function makeMove(i) {
    board[i] = currentPlayer;
    const cells = document.querySelectorAll('.cell');
    cells[i].textContent = currentPlayer === 'X' ? '✕' : '○';
    cells[i].classList.add('taken', currentPlayer === 'X' ? 'x-cell' : 'o-cell', 'pop');
    const winner = checkWinner();
    if (winner) {
      highlight(winner);
      scores[currentPlayer]++;
      updateScores();
      const name = mode === 'pvc' && currentPlayer === 'O' ? 'Computer' : currentPlayer;
      setStatus(`🎉 ${name} wins!`);
      gameOver = true;
      updateTurnUI(null);
    } else if (board.every(c => c)) {
      scores.D++;
      updateScores();
      setStatus("🤝 It's a draw!");
      gameOver = true;
      updateTurnUI(null);
    } else {
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      const turnName = mode === 'pvc' && currentPlayer === 'O' ? 'Computer' : currentPlayer;
      setStatus(`${currentPlayer === 'X' ? '✕' : '○'} ${turnName}'s turn`);
      updateTurnUI(currentPlayer);
    }
  }

  function computerMove() {
    const best = getBestMove();
    makeMove(best);
  }

  function getBestMove() {
    // Win if possible
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        if (checkWinner()) { board[i] = null; return i; }
        board[i] = null;
      }
    }
    // Block X
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'X';
        if (checkWinner()) { board[i] = null; return i; }
        board[i] = null;
      }
    }
    // Center
    if (!board[4]) return 4;
    // Corner
    const corners = [0,2,6,8].filter(i => !board[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    // Any
    const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function checkWinner() {
    return WINS.find(([a,b,c]) => board[a] && board[a] === board[b] && board[b] === board[c]) || null;
  }

  function highlight(combo) {
    const cells = document.querySelectorAll('.cell');
    combo.forEach(i => cells[i].classList.add('winner'));
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  function updateTurnUI(player) {
    const sx = document.getElementById('scoreX');
    const so = document.getElementById('scoreO');
    sx.classList.remove('active-turn', 'o-turn');
    so.classList.remove('active-turn', 'o-turn');
    if (player === 'X') sx.classList.add('active-turn');
    if (player === 'O') { so.classList.add('active-turn', 'o-turn'); }
  }

  function updateScores() {
    document.getElementById('numX').textContent = scores.X;
    document.getElementById('numO').textContent = scores.O;
    document.getElementById('numD').textContent = scores.D;
  }

  function resetBoard() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    document.querySelectorAll('.cell').forEach(c => {
      c.textContent = '';
      c.className = 'cell';
    });
    setStatus("✕ X's turn");
    updateTurnUI('X');
  }

  function resetAll() {
    scores = { X: 0, O: 0, D: 0 };
    updateScores();
    resetBoard();
  }
</script>
</body>
</html>
